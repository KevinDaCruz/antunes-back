name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # mongodb-memory-server télécharge et lance son propre MongoDB en
        # mémoire : pas besoin de service Mongo dans ce workflow.
        run: npm run test:coverage

      - name: Audit dependencies
        run: npm audit --audit-level=high
